name: Build FRONX OS

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Installs Gradle 8.7 on PATH, so no gradle-wrapper.jar is needed in the repo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode release keystore (only if secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fronx.jks"
            echo "FRONX_KEYSTORE_PATH=$RUNNER_TEMP/fronx.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug + release APKs
        env:
          FRONX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FRONX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FRONX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fronx-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        if: env.FRONX_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: fronx-os-release-apk
          path: app/build/outputs/apk/release/*.apk
